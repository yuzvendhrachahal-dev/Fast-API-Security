[project]
name = "fastapi-security"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yuzi", email = "yuzvendhrachahal@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "pyjwt>=2.13.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn>=0.52.4",
]

[project.scripts]
fastapi-security = "fastapi_security:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
